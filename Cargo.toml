[package]
name = "rstory"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "A small, private clipboard history for Linux (Wayland and X11)"
repository = "https://github.com/lucasvmigotto/rstory"
readme = "README.md"
keywords = ["clipboard", "history", "wayland", "x11"]
categories = ["command-line-utilities"]

[lib]
name = "rstory"
path = "src/lib.rs"

[[bin]]
name = "rstory"
path = "src/main.rs"

[features]
default = []
# Test-only: FaultFs and the power-loss model. Never enabled in release builds.
fault-injection = []
# Session tests (headless compositors); no tests yet.
session-tests = []

# Tests that use FaultFs need the feature; without it they are skipped, not broken.
[[test]]
name = "store_crash"
required-features = ["fault-injection"]

[[test]]
name = "store_fail"
required-features = ["fault-injection"]

[[test]]
name = "store_trace"
required-features = ["fault-injection"]

[[bench]]
name = "store"
harness = false

[dependencies]
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
rand = "0.10.3"
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
time = { version = "0.3.55", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
