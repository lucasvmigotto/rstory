# cargo-deny configuration: F3 (no native or network crates) and F4 (GPL-3.0-compatible licences).

[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
deny = [
    { crate = "openssl-sys" },
    { crate = "openssl" },
    { crate = "libdbus-sys" },
    { crate = "xcb" },
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "ureq" },
    { crate = "native-tls" },
]

# wayland-client's pure-Rust backend still lists wayland-sys as a dependency, but without
# features it is type definitions only. Any feature that links or dlopen()s libwayland is banned.
[[bans.features]]
crate = "wayland-sys"
deny = ["client", "server", "cursor", "egl", "dlopen"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
