# Release (spec 013 US2, FR-003/004, ADR-0009): a plain SemVer tag X.Y.Z on main builds and tests
# both musl targets, publishes the crate through crates.io Trusted Publishing (OIDC, no stored
# token) in the protected `release` environment, then creates the GitHub release with the
# tarballs and SHA256SUMS. If publishing fails, no release is created.
# Manual runs (workflow_dispatch) are always dry runs: artifacts + cargo publish --dry-run.
name: release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package both targets and run cargo publish --dry-run; manual runs never publish.
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CPUS: "4"
  MEMORY: 12g

jobs:
  verify:
    name: verify tag, version and SC-001
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a manual run that is not a dry run
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          echo "::error::manual runs are dry runs only; publish by pushing a tag X.Y.Z on main (docs/release.md)"
          exit 1
      - name: Tag is X.Y.Z, on main, and equals the crate version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          publish=false
          if [ "$EVENT" = push ]; then
            [ "$REF_TYPE" = tag ] || { echo "::error::release runs on tags only"; exit 1; }
            if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag $TAG is not plain SemVer X.Y.Z"; exit 1
            fi
            if [ "$TAG" != "$version" ]; then
              echo "::error::tag $TAG does not match Cargo.toml version $version"; exit 1
            fi
            # HEAD is the tagged commit (annotated tags dereferenced by the checkout).
            if ! git merge-base --is-ancestor "$(git rev-parse 'HEAD^{commit}')" origin/main; then
              echo "::error::tag $TAG is not on main; releases are cut from main only"; exit 1
            fi
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release $version (publish=$publish)" >> "$GITHUB_STEP_SUMMARY"
      - name: No publishing token referenced (SC-001)
        run: .github/scripts/no-publish-token.sh .github

  ci:
    name: ci (main set)
    needs: verify
    permissions:
      contents: read
      issues: write # ci.yml's failure reporter (it only acts on branch pushes, never here)
    uses: ./.github/workflows/ci.yml
    with:
      stage: release

  build:
    name: package (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
      - name: Static musl release build, F2 + F5 (make build-static)
        run: make build-static
      - name: Package rstory-X.Y.Z-<arch>-unknown-linux-musl.tar.gz (FR-004)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          triple="$ARCH-unknown-linux-musl"
          name="rstory-$VERSION-$triple"
          stage="$RUNNER_TEMP/stage/$name"
          install -d "$stage" dist
          install -m 0755 "$RUNNER_TEMP/target/$triple/release/rstory" "$stage/rstory"
          install -m 0644 LICENSE README.md "$stage/"
          # Reproducible: fixed order, owner and mtime (the release commit's time), no gzip name/time.
          mtime=$(git log -1 --format=%ct)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$mtime" \
            -C "$RUNNER_TEMP/stage" -cf - "$name" | gzip -9n > "dist/$name.tar.gz"
          (cd dist && sha256sum "$name.tar.gz")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: SHA256SUMS
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          n=$(find . -maxdepth 1 -name 'rstory-*-unknown-linux-musl.tar.gz' | wc -l)
          [ "$n" -eq 2 ] || { echo "::error::expected 2 tarballs, found $n"; exit 1; }
          sha256sum rstory-*-unknown-linux-musl.tar.gz > SHA256SUMS
          cat SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-dry-run:
    name: cargo publish --dry-run
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
      - name: Package and verify the crate (make publish-dry-run)
        run: make publish-dry-run

  publish:
    name: publish to crates.io (Trusted Publishing)
    needs: [verify, ci, checksums, publish-dry-run]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC for crates.io Trusted Publishing; this job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Already on crates.io? (a re-run after a failed release step)
        id: existing
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'rstory-release (github.com/lucasvmigotto/rstory)' \
            "https://crates.io/api/v1/crates/rstory/$VERSION")
          if [ "$code" = 200 ]; then echo "published=true" >> "$GITHUB_OUTPUT"; echo "rstory $VERSION is already on crates.io"
          else echo "published=false" >> "$GITHUB_OUTPUT"; fi
      - uses: ./.github/actions/tools
        if: steps.existing.outputs.published != 'true'
      - name: Exchange the OIDC token for a short-lived crates.io token
        if: steps.existing.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # --no-verify (in the recipe): the publish-dry-run job, a `needs:` of this job, already built
      # the packaged crate from this same commit. Verifying here would run every dependency's
      # build script and proc macro with the crates.io token set and the network on.
      - name: Publish (make publish, cargo publish --no-verify)
        if: steps.existing.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: make publish

  github-release:
    name: GitHub release
    needs: [verify, publish]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Create the release with the tarballs and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" rstory-*-unknown-linux-musl.tar.gz SHA256SUMS --clobber
          else
            gh release create "$VERSION" rstory-*-unknown-linux-musl.tar.gz SHA256SUMS \
              --verify-tag --title "rstory $VERSION" --generate-notes
          fi

  report-failure:
    name: report failure
    needs: [verify, ci, build, checksums, publish-dry-run, publish, github-release]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # open or update the "CI failing" issue
    steps:
      - name: Open or update the "CI failing" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "CI failing: ${{ github.workflow }} on ${{ github.ref_name }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          n=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "Failed again: $RUN"
          else gh issue create --title "$TITLE" --body "Run: $RUN. Nothing was released if the publish job failed (docs/release.md)."; fi
